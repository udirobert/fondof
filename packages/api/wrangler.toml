name = "fondof-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e7383c0c7474c8f61cc06598eeb134a0"

# Edge cache + rate limits use caches.default (no KV binding required).
# KV for auth sessions + usage counters + pro tier.
[[kv_namespaces]]
binding = "SESSIONS"
id = "69b2ac71d2614f3bac5ae59c12095480"

# Serialized mutations (OAuth exchange consume, skill evidence counters).
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "FondofCoordinator"

[[migrations]]
tag = "v1"
new_classes = ["FondofCoordinator"]

[vars]
MONAD_RPC_URL = "https://monad-testnet.g.alchemy.com/v2/L69xEIR9jJjLmdvq798gQCQ1Rq8GI4I2"
FONDOF_CONTRACT_ADDRESS = "0x75545e2C450897914df416d0D24aeB33a89a8b19"
FRONTEND_URL = "https://fondof.netlify.app"
# Secrets deployed (not committed):
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# FONDOF_RELAYER_KEY, FONDOF_RESOLVER_KEY, RESOLVER_LOGINS
# RELAYER_HALT=1 emergency-stops all relayer-sponsored writes.

[ai]
binding = "AI"
