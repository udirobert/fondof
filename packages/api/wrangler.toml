name = "fondof-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MONAD_RPC_URL = "https://monad-testnet.g.alchemy.com/v2/L69xEIR9jJjLmdvq798gQCQ1Rq8GI4I2"
FONDOF_CONTRACT_ADDRESS = "0x1c0b6C42acD41BE5582a8F34137Acb713107170a"

# Secrets — set via `wrangler secret put` or in .dev.vars locally:
# CF_API_TOKEN
# FONDOF_RELAYER_KEY
# NVIDIA_API_KEY (optional fallback)
