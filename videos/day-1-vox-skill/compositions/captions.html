  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE paper card — heavy 1.5px brown-black ink rule + a 4px tomato-red leftbar
     (bold poster's cantilevered red-leftbar-card signature), square corners, NO
     drop shadow (the only shadow in the system is the stacked text-shadow on red) */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: var(--cap-canvas, #ffffff);
    border: 1.5px solid var(--cap-ink, #1c1410);
    border-left: 4px solid var(--cap-accent, #d8000f);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.01em;
  }

  /* upcoming — faint brown-black ink, no panel */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #1c1410) 42%, var(--cap-canvas, #ffffff));
  }
  /* current word — THE tomato-red panel (box-shadow spread = a hard square block
     w/o layout shift; no blur), paper-white reading on top carrying the stacked
     text-shadow — bold poster's surface-inversion + only-shadow signatures */
  .caption-word.is-active {
    color: var(--cap-canvas, #ffffff);
    background: var(--cap-accent, #d8000f);
    box-shadow: 0 0 0 0.06em var(--cap-accent, #d8000f);
    text-shadow:
      0.03em 0.03em 0 rgba(28, 20, 16, 0.25),
      0.06em 0.06em 0 rgba(28, 20, 16, 0.2),
      0.09em 0.09em 0 rgba(28, 20, 16, 0.15);
  }
  /* already spoken — solid brown-black ink, panel cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1c1410);
    background: transparent;
    box-shadow: none;
    text-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Shrikhand display, bold poster's display face inflection */
  .caption-word.cap-brand {
    font-family: "Libre Baskerville", Georgia, serif;
  }
  /* numerals / data — the mono chrome voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Libre Baskerville", ui-monospace, monospace;
    color: color-mix(in srgb, var(--cap-ink, #1c1410) 72%, var(--cap-canvas, #ffffff));
  }

  .caption-word.cap-cta {

    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #f5f2ef);

    }

      font-size: clamp(34px, 5.4vw, 48px);
    }
