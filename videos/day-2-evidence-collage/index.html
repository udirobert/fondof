<!DOCTYPE html>

  <head>

    <style>

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F7F1E5; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-root2" id="root" data-composition-id="main" data-start="0" data-duration="56.0" data-width="1080" data-height="1920">
      <!-- Frame 1: The Flood -->
      <div data-hf-id="hf-s01" id="el-01-flood" class="scene" data-composition-id="01-flood" data-composition-src="compositions/frames/01-flood.html" data-start="0" data-duration="9.927" data-track-index="0"></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions ──
      (function () {
        var tl = window.__timelines["main"];
        // 1 → 2 : vertical slide
        tl.to("#el-01-flood", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 9.427);
        tl.fromTo("#el-02-question", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 9.427);
        // 2 → 3 : vertical slide
        tl.to("#el-02-question", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 14.582);
        tl.fromTo("#el-03-sources", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 14.582);
        // 3 → 4 : zoom-blur into the forge
        tl.to("#el-03-sources", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 27.260);
        tl.fromTo("#el-04-forge", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 27.260);
        // 4 → 5 : vertical slide
        tl.to("#el-04-forge", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 34.412);
        tl.fromTo("#el-05-reject", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 34.412);
        // 5 → 6 : zoom-blur out of rejection
        tl.to("#el-05-reject", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 40.124);
        tl.fromTo("#el-06-reforge", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 40.124);
        // 6 → 7 : soft blur crossfade
        tl.to("#el-06-reforge", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 47.369);
        tl.fromTo("#el-07-close", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 47.369);
        // full-span anchor — main.duration() == composition total
        tl.to({}, { duration: 56.0 }, 0);
      })();
    </script>
